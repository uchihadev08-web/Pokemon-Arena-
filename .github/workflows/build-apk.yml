name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.draco.pokemonarena2d",
            "appName": "Pokemon Arena 2D",
            "webDir": "www"
          }
          EOF
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync

      - name: Landscape and fullscreen
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/draco/pokemonarena2d/MainActivity.java <<'EOF'
          package com.draco.pokemonarena2d;

          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
            }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-arena-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
